<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="90b0b752-39a0-4d32-a614-8dcc9d242af8"></script>
    <!-- GA4, the same property as the site, so the funnel from a location page to a booking is
         one report. Mirrors next-app/components/shared/Analytics.tsx: the dataLayer/gtag shim,
         a delegated listener on [data-mbm-track], first-touch attribution in storage, and
         gtag.js loaded on the first interaction or after four seconds. Events fired before it
         loads are queued. next-app/lib/__tests__/cta-tracking.test.ts pins the two copies. -->
    <script>
      (function(){
        window.dataLayer=window.dataLayer||[];
        window.gtag=window.gtag||function(){window.dataLayer.push(arguments)};
        document.addEventListener('click',function(e){
          var el=e.target&&e.target.closest?e.target.closest('[data-mbm-track]'):null;
          if(!el)return;
          var d=el.dataset;
          window.gtag('event',d.mbmTrack,{
            city:d.mbmCity||'(none)',zone:d.mbmZone||'(none)',locality:d.mbmLocality||'(none)',
            service:d.mbmService||'(none)',pincode:d.mbmPincode||'(none)',source:'app',page_path:location.pathname
          });
        },{passive:true,capture:true});
        try{
          var q=new URLSearchParams(location.search),a={},has=false;
          ["utm_source","utm_medium","utm_campaign","utm_term","utm_content","gclid","fbclid","msclkid"].forEach(function(k){var v=q.get(k);if(v){a[k]=v.slice(0,120);has=true;}});
          var ref=document.referrer;
          if(ref&&ref.indexOf(location.origin)!==0){a.referrer=ref.slice(0,200);has=true;}
          if(has){
            a.landing=location.pathname;a.at=new Date().toISOString();
            sessionStorage.setItem('mbm_attr',JSON.stringify(a));
            if(!localStorage.getItem('mbm_first_attr'))localStorage.setItem('mbm_first_attr',JSON.stringify(a));
          }
        }catch(e){}
        var loaded=false;
        function load(){
          if(loaded)return; loaded=true;
          var g=document.createElement('script');
          g.async=true; g.src='https://www.googletagmanager.com/gtag/js?id=G-R24QC81J4P';
          g.onload=function(){ window.gtag('js',new Date()); window.gtag('config','G-R24QC81J4P',{send_page_view:true}); };
          document.head.appendChild(g);
        }
        ['pointerdown','keydown','touchstart','scroll'].forEach(function(evt){
          window.addEventListener(evt,load,{once:true,passive:true});
        });
        setTimeout(load,4000);
        window.addEventListener('pagehide',load,{once:true});
      })();
    </script>
    <meta name="description" content="MyBuddyMaid — Book trusted maids, cooks, nannies, and elderly care helpers in Delhi NCR. Verified and reliable home help services." />
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MyBuddyMaid — Trusted Home Help</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
