<!DOCTYPE html>
<html lang="en">
<head>
  {{> head}}
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="keywords" content="{{pageKeywords}}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{h1}}",
    "description": "{{pageDescription}}",
    "author": {
      "@type": "Organization",
      "name": "MyBuddyMaid",
      "url": "https://mybuddymaid.in"
    },
    "publisher": {
      "@type": "Organization",
      "name": "MyBuddyMaid",
      "logo": {
        "@type": "ImageObject",
        "url": "https://mybuddymaid.in/logo.png"
      }
    },
    "datePublished": "{{datePublished}}",
    "dateModified": "{{dateModified}}",
    "mainEntityOfPage": "{{canonicalUrl}}"
  }
  </script>
  <script type="application/ld+json">
  {{breadcrumbSchema}}
  </script>
  <script type="application/ld+json">
  {{faqSchema}}
  </script>

  <style>
    .blog-hero{padding:140px 0 60px;background:linear-gradient(135deg,#1A1A2E 0%,#0D5C63 100%);color:#fff;text-align:center;position:relative;overflow:hidden}
    .blog-hero::before{content:'';position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:rgba(244,166,35,.12);border-radius:50%;filter:blur(60px)}
    .blog-hero h1{font-size:clamp(1.8rem,4.5vw,2.8rem);margin-bottom:1rem;position:relative;z-index:1;max-width:800px;margin-left:auto;margin-right:auto;line-height:1.3}
    .blog-hero p{font-size:1.1rem;color:rgba(255,255,255,.8);max-width:650px;margin:0 auto 1.5rem;position:relative;z-index:1;line-height:1.7}
    .blog-hero .badge{background:rgba(244,166,35,.2);color:#F4A623;border:1px solid rgba(244,166,35,.3);margin-bottom:1.5rem;display:inline-block;position:relative;z-index:1;padding:.35rem .85rem;border-radius:20px;font-size:.85rem;font-weight:600}
    .blog-meta{display:flex;gap:1.5rem;justify-content:center;align-items:center;font-size:.9rem;color:rgba(255,255,255,.6);position:relative;z-index:1}
    .blog-content{padding:60px 0;background:var(--bg)}
    .blog-article{max-width:800px;margin:0 auto}
    .blog-article h2{font-size:1.6rem;margin:2.5rem 0 1rem;color:var(--primary);line-height:1.3}
    .blog-article h3{font-size:1.25rem;margin:2rem 0 .75rem;color:var(--dark)}
    .blog-article p{font-size:1.05rem;line-height:1.85;color:var(--text);margin-bottom:1.25rem}
    .blog-article ul,.blog-article ol{padding-left:1.5rem;margin-bottom:1.5rem}
    .blog-article li{font-size:1.05rem;color:var(--text);line-height:1.8;margin-bottom:.5rem}
    .blog-article ul li{list-style:disc}
    .blog-article ol li{list-style:decimal}
    .blog-article strong{color:var(--dark);font-weight:700}
    .blog-article blockquote{border-left:4px solid var(--primary);background:rgba(13,92,99,.04);padding:1.25rem 1.5rem;margin:1.5rem 0;border-radius:0 12px 12px 0;font-style:italic;color:var(--text)}
    .blog-article table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.95rem;border-radius:8px;overflow:hidden}
    .blog-article th{background:var(--dark);color:#fff;padding:.85rem 1rem;text-align:left;font-weight:600}
    .blog-article td{padding:.85rem 1rem;border-bottom:1px solid #E5E7EB;color:var(--text)}
    .blog-article tr:hover td{background:rgba(13,92,99,.03)}
    .blog-tip{background:rgba(244,166,35,.08);border:1px solid rgba(244,166,35,.2);border-radius:12px;padding:1.5rem;margin:2rem 0}
    .blog-tip strong{color:#C07F00}
    .blog-cta{background:var(--dark);border-radius:16px;padding:2.5rem 2rem;text-align:center;margin:3rem 0;position:relative;overflow:hidden}
    .blog-cta::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:var(--primary);border-radius:50%;opacity:.4;filter:blur(40px)}
    .blog-cta h3{color:#fff;font-size:1.5rem;margin-bottom:.75rem;position:relative;z-index:1}
    .blog-cta p{color:#A0A0B0;margin-bottom:1.5rem;font-size:1rem;position:relative;z-index:1}
    .blog-cta .btn{position:relative;z-index:1}
    .seo-faq{margin:1rem 0}
    .seo-faq details{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.05);margin-bottom:.75rem;overflow:hidden}
    .seo-faq summary{padding:1.25rem 1.5rem;cursor:pointer;font-weight:600;color:var(--dark);font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
    .seo-faq summary::-webkit-details-marker{display:none}
    .seo-faq summary::after{content:'+';font-size:1.5rem;color:var(--primary);font-weight:300;transition:transform .2s}
    .seo-faq details[open] summary::after{transform:rotate(45deg)}
    .seo-faq .faq-answer{padding:0 1.5rem 1.25rem;font-size:1rem;line-height:1.7;color:var(--text)}
    .seo-link-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 2rem}
    .seo-link-grid a{display:inline-block;padding:.5rem 1rem;background:#fff;border:1px solid rgba(13,92,99,.15);border-radius:8px;color:var(--primary);font-size:.9rem;font-weight:500;text-decoration:none;transition:all .2s}
    .seo-link-grid a:hover{background:var(--primary);color:#fff}
    .seo-breadcrumb{padding:.75rem 0;font-size:.85rem;color:var(--text-muted)}
    .seo-breadcrumb a{color:var(--primary);text-decoration:none}
    .seo-breadcrumb span{margin:0 .5rem}
    @media(max-width:768px){.blog-hero{padding:120px 0 40px}.blog-hero h1{font-size:1.6rem}.blog-article{padding:0 1rem}.blog-meta{flex-wrap:wrap;gap:.75rem}}
  </style>
</head>
<body>
  {{> header}}

  <section class="blog-hero">
    <div class="container">
      <div class="badge">{{category}}</div>
      <h1>{{h1}}</h1>
      <p>{{heroSubtitle}}</p>
      <div class="blog-meta">
        <span>📅 {{datePublished}}</span>
        <span>⏱️ {{readTime}} min read</span>
        <span>✍️ MyBuddyMaid Team</span>
      </div>
    </div>
  </section>

  <div class="container">
    <div class="seo-breadcrumb">
      <a href="/">Home</a> <span>›</span>
      <a href="/blog.html">Blog</a> <span>›</span>
      <strong>{{breadcrumbTitle}}</strong>
    </div>
  </div>

  <section class="blog-content">
    <div class="container">
      <article class="blog-article">
        {{articleBody}}
      </article>
    </div>
  </section>

  {{> footer}}
</body>
</html>
