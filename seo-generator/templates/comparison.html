<!DOCTYPE html>
<html lang="en">
<head>
  {{> head}}
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="keywords" content="{{pageKeywords}}">

  <script type="application/ld+json">
  {{breadcrumbSchema}}
  </script>
  <script type="application/ld+json">
  {{faqSchema}}
  </script>

  <style>
    .seo-hero{padding:140px 0 60px;background:linear-gradient(135deg,#0D5C63 0%,#1A1A2E 100%);color:#fff;text-align:center;position:relative;overflow:hidden}
    .seo-hero::before{content:'';position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:rgba(244,166,35,.15);border-radius:50%;filter:blur(60px)}
    .seo-hero h1{font-size:clamp(1.8rem,4.5vw,2.8rem);margin-bottom:1rem;position:relative;z-index:1}
    .seo-hero p{font-size:1.1rem;color:rgba(255,255,255,.85);max-width:700px;margin:0 auto 2rem;position:relative;z-index:1;line-height:1.7}
    .seo-hero .badge{background:rgba(244,166,35,.2);color:#F4A623;border:1px solid rgba(244,166,35,.3);margin-bottom:1.5rem;display:inline-block;position:relative;z-index:1}
    .seo-content{padding:60px 0;background:var(--bg)}
    .seo-article{max-width:880px;margin:0 auto}
    .seo-article h2{font-size:1.6rem;margin:2.5rem 0 1rem;color:var(--primary)}
    .seo-article h3{font-size:1.2rem;margin:1.5rem 0 .75rem;color:var(--dark)}
    .seo-article p{font-size:1.05rem;line-height:1.8;color:var(--text);margin-bottom:1.25rem}
    .seo-article ul,.seo-article ol{padding-left:1.5rem;margin-bottom:1.5rem}
    .seo-article li{font-size:1.05rem;color:var(--text);line-height:1.8;margin-bottom:.5rem}
    .seo-article ul li{list-style:disc}
    .seo-article ol li{list-style:decimal}
    .seo-article strong{color:var(--dark);font-weight:700}
    .vs-table{width:100%;border-collapse:collapse;margin:1.5rem 0 2rem;font-size:.95rem;border-radius:8px;overflow:hidden}
    .vs-table th{background:var(--dark);color:#fff;padding:1rem;text-align:left;font-weight:600}
    .vs-table td{padding:1rem;border-bottom:1px solid #E5E7EB;color:var(--text)}
    .vs-table tr:hover td{background:rgba(13,92,99,.04)}
    .vs-highlight{background:rgba(13,92,99,.06);font-weight:600}
    .seo-tip{background:rgba(244,166,35,.08);border:1px solid rgba(244,166,35,.2);border-radius:12px;padding:1.5rem;margin:2rem 0}
    .seo-tip strong{color:#C07F00}
    .verdict-box{background:linear-gradient(135deg,#0D5C63,#1A1A2E);border-radius:16px;padding:2rem;margin:2rem 0;color:#fff}
    .verdict-box h3{color:#F4A623;margin-bottom:1rem;font-size:1.3rem}
    .verdict-box p{color:rgba(255,255,255,.85);margin-bottom:.5rem;line-height:1.7}
    .seo-cta{background:var(--dark);border-radius:16px;padding:3rem 2rem;text-align:center;margin:3rem 0;position:relative;overflow:hidden}
    .seo-cta::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:var(--primary);border-radius:50%;opacity:.5;filter:blur(40px)}
    .seo-cta h3{color:#fff;font-size:1.8rem;margin-bottom:1rem;position:relative;z-index:1}
    .seo-cta p{color:#A0A0B0;margin-bottom:2rem;font-size:1.1rem;position:relative;z-index:1}
    .seo-cta .btn{position:relative;z-index:1}
    .seo-faq{margin:1rem 0}
    .seo-faq details{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.05);margin-bottom:.75rem;overflow:hidden}
    .seo-faq summary{padding:1.25rem 1.5rem;cursor:pointer;font-weight:600;color:var(--dark);font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
    .seo-faq summary::-webkit-details-marker{display:none}
    .seo-faq summary::after{content:'+';font-size:1.5rem;color:var(--primary);font-weight:300;transition:transform .2s}
    .seo-faq details[open] summary::after{transform:rotate(45deg)}
    .seo-faq .faq-answer{padding:0 1.5rem 1.25rem;font-size:1rem;line-height:1.7;color:var(--text)}
    .seo-link-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 2rem}
    .seo-link-grid a{display:inline-block;padding:.5rem 1rem;background:#fff;border:1px solid rgba(13,92,99,.15);border-radius:8px;color:var(--primary);font-size:.9rem;font-weight:500;text-decoration:none;transition:all .2s}
    .seo-link-grid a:hover{background:var(--primary);color:#fff}
    .seo-breadcrumb{padding:.75rem 0;font-size:.85rem;color:var(--text-muted)}
    .seo-breadcrumb a{color:var(--primary);text-decoration:none}
    .seo-breadcrumb span{margin:0 .5rem}
    .pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin:1.5rem 0}
    .pros,.cons{background:#fff;border-radius:12px;padding:1.5rem;border:1px solid rgba(0,0,0,.05)}
    .pros h4{color:#0D5C63;margin-bottom:.75rem}.cons h4{color:#c0392b;margin-bottom:.75rem}
    .pros li::marker{color:#0D5C63}.cons li::marker{color:#c0392b}
    @media(max-width:768px){.seo-hero{padding:120px 0 40px}.seo-hero h1{font-size:1.6rem}.seo-article{padding:0 1rem}.pros-cons{grid-template-columns:1fr}}
  </style>
</head>
<body>
  {{> header}}

  <section class="seo-hero">
    <div class="container">
      <div class="badge">{{badge}}</div>
      <h1>{{h1}}</h1>
      <p>{{heroSubtitle}}</p>
      <a href="/home" class="btn btn-primary" style="font-size:1.1rem;padding:1rem 2.5rem">Book Home Help Now</a>
    </div>
  </section>

  <div class="container">
    <div class="seo-breadcrumb">
      <a href="/">Home</a> <span>›</span>
      <a href="/index.html#blog">Guides</a> <span>›</span>
      <strong>{{breadcrumbTitle}}</strong>
    </div>
  </div>

  <section class="seo-content">
    <div class="container">
      <article class="seo-article">
        {{articleBody}}
      </article>
    </div>
  </section>

  {{> footer}}
</body>
</html>
