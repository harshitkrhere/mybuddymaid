<!DOCTYPE html>
<html lang="en">
<head>
  {{> head}}
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta name="keywords" content="{{pageKeywords}}">

  <script type="application/ld+json">
  {{breadcrumbSchema}}
  </script>

  <style>
    .hub-hero{padding:140px 0 60px;background:linear-gradient(135deg,#0D5C63 0%,#1A1A2E 100%);color:#fff;text-align:center;position:relative;overflow:hidden}
    .hub-hero::before{content:'';position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:rgba(244,166,35,.15);border-radius:50%;filter:blur(60px)}
    .hub-hero::after{content:'';position:absolute;bottom:-80px;left:-80px;width:250px;height:250px;background:rgba(13,92,99,.3);border-radius:50%;filter:blur(50px)}
    .hub-hero h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:1rem;position:relative;z-index:1}
    .hub-hero p{font-size:1.15rem;color:rgba(255,255,255,.85);max-width:700px;margin:0 auto 2rem;position:relative;z-index:1;line-height:1.7}
    .hub-hero .badge{background:rgba(244,166,35,.2);color:#F4A623;border:1px solid rgba(244,166,35,.3);margin-bottom:1.5rem;display:inline-block;position:relative;z-index:1;padding:.35rem .85rem;border-radius:20px;font-size:.85rem;font-weight:600}
    .hub-content{padding:60px 0;background:var(--bg)}
    .hub-section{max-width:1100px;margin:0 auto;padding:0 1rem}
    .hub-section h2{font-size:1.6rem;margin:2.5rem 0 1rem;color:var(--primary)}
    .hub-section h3{font-size:1.2rem;margin:1.5rem 0 .75rem;color:var(--dark)}
    .hub-section p{font-size:1.05rem;line-height:1.8;color:var(--text);margin-bottom:1.25rem}
    .hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;margin:1.5rem 0 2.5rem}
    .hub-card{background:#fff;border-radius:16px;padding:1.75rem;border:1px solid rgba(0,0,0,.06);transition:all .3s;text-decoration:none;color:inherit;display:block}
    .hub-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.08);border-color:rgba(13,92,99,.2)}
    .hub-card .icon{font-size:2rem;margin-bottom:.75rem;display:block}
    .hub-card h4{color:var(--dark);font-size:1.15rem;margin-bottom:.5rem}
    .hub-card p{font-size:.92rem;color:var(--text-muted);margin:0;line-height:1.6}
    .hub-card .arrow{color:var(--primary);font-weight:700;font-size:.9rem;margin-top:.75rem;display:inline-block}
    .hub-link-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 2rem}
    .hub-link-grid a{display:inline-block;padding:.5rem 1rem;background:#fff;border:1px solid rgba(13,92,99,.15);border-radius:8px;color:var(--primary);font-size:.9rem;font-weight:500;text-decoration:none;transition:all .2s}
    .hub-link-grid a:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
    .hub-cta{background:var(--dark);border-radius:16px;padding:3rem 2rem;text-align:center;margin:3rem 0;position:relative;overflow:hidden}
    .hub-cta::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:var(--primary);border-radius:50%;opacity:.5;filter:blur(40px)}
    .hub-cta h3{color:#fff;font-size:1.8rem;margin-bottom:1rem;position:relative;z-index:1}
    .hub-cta p{color:#A0A0B0;margin-bottom:2rem;font-size:1.1rem;position:relative;z-index:1}
    .hub-cta .btn{position:relative;z-index:1}
    .seo-breadcrumb{padding:.75rem 0;font-size:.85rem;color:var(--text-muted)}
    .seo-breadcrumb a{color:var(--primary);text-decoration:none}
    .seo-breadcrumb span{margin:0 .5rem}
    .city-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin:1.5rem 0}
    .city-stat{background:#fff;border-radius:12px;padding:1.25rem;text-align:center;border:1px solid rgba(0,0,0,.05)}
    .city-stat .num{font-size:1.8rem;font-weight:800;color:var(--primary);display:block}
    .city-stat .label{font-size:.82rem;color:var(--text-muted);margin-top:.25rem}
    @media(max-width:768px){.hub-hero{padding:120px 0 40px}.hub-hero h1{font-size:1.8rem}.hub-grid{grid-template-columns:1fr}.hub-section{padding:0 1rem}}
  </style>
</head>
<body>
  {{> header}}

  <section class="hub-hero">
    <div class="container">
      <div class="badge">{{badge}}</div>
      <h1>{{h1}}</h1>
      <p>{{heroSubtitle}}</p>
      <a href="/home" class="btn btn-primary" style="font-size:1.1rem;padding:1rem 2.5rem">Book Home Help Now</a>
    </div>
  </section>

  <div class="container">
    <div class="seo-breadcrumb">
      <a href="/">Home</a> <span>›</span>
      {{breadcrumbTrail}}
    </div>
  </div>

  <section class="hub-content">
    <div class="hub-section">
      {{articleBody}}
    </div>
  </section>

  {{> footer}}
</body>
</html>
