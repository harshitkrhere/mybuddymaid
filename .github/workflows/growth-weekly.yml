# Growth — weekly report (docs/growth/README.md).
#
# Monday morning IST: pull Search Console, GA4, Bing and the database counts for the week
# that ended three days ago, compose docs/growth/reports/<date>.md, commit it (data only,
# path-guarded), crawl production for broken links and redirect chains, and open or update
# the `growth-alert` issue if a source failed or a threshold was breached. Each collector
# continues on error so one outage still produces a report — with that source marked n/a —
# and still fails the job so the alert fires.
#
# Secrets: GSC_SERVICE_ACCOUNT_JSON, GA4_PROPERTY_ID, BING_WEBMASTER_API_KEY, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY. Failure e-mails go to the person who committed this file.
name: Growth — weekly report

on:
  schedule:
    - cron: '47 2 * * 1' # Monday 08:17 IST
  workflow_dispatch:
    inputs:
      end:
        description: Window end, YYYY-MM-DD (default three days before the run)
        required: false
      baseline:
        description: Also write docs/growth/baseline.md (first run only)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: growth-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    outputs:
      alerts: ${{ steps.report.outputs.alerts }}
      report: ${{ steps.report.outputs.report }}
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # a plain path: the `runner` context is not available in a job-level env block
      GROWTH_RAW_DIR: /tmp/growth-raw
      GROWTH_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - id: gsc
        continue-on-error: true
        run: npm run growth:gsc
      - id: ga4
        continue-on-error: true
        run: npm run growth:ga4
      - id: bing
        continue-on-error: true
        run: npm run growth:bing
      - id: supabase
        continue-on-error: true
        run: npm run growth:supabase
      - id: report
        run: |
          npm run growth:report -- ${{ inputs.baseline && '--baseline' || '' }}
          echo "alerts=$(jq -c . ../docs/growth/alerts.json)" >> "$GITHUB_OUTPUT"
          echo "report=docs/growth/reports/latest.md" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-raw-${{ github.run_id }}
          path: /tmp/growth-raw
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit snapshots and report
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/growth
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if git diff --cached --name-only | grep -v '^docs/growth/'; then echo "::error::a path outside docs/growth/ was staged"; exit 1; fi
          git commit -m "growth: weekly report $(date -u +%F) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Fail the job if a collector failed (the report was still written)
        run: |
          failed=0
          for s in "${{ steps.gsc.outcome }}" "${{ steps.ga4.outcome }}" "${{ steps.bing.outcome }}" "${{ steps.supabase.outcome }}"; do
            [ "$s" = "failure" ] && failed=1
          done
          [ "$failed" = 0 ]

  site-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    env:
      BASE_URL: https://mybuddymaid.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - name: Crawl production (broken links, orphans, canonical and robots correctness)
        run: npm run seo:crawl 2>&1 | tee "${{ runner.temp }}/crawl.log"
      - name: Sample the redirect map (single hop, no chains)
        run: SAMPLE=1500 npm run seo:check-redirects 2>&1 | tee "${{ runner.temp }}/redirects.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-health-${{ github.run_id }}
          path: ${{ runner.temp }}/*.log
          retention-days: 90

  alert:
    needs: [collect, site-health]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COLLECT_RESULT: ${{ needs.collect.result }}
      HEALTH_RESULT: ${{ needs.site-health.result }}
      ALERTS: ${{ needs.collect.outputs.alerts }}
      REPORT_PATH: ${{ needs.collect.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/growth-alert.mjs
