# Growth — one-off data check. Manual only. Prints day counts, status counts and unmatched
# city strings from the bookings and profiles tables (never a name, e-mail or number), so a
# question about the numbers can be answered where the service key lives. Commits nothing.
name: Growth — data check (manual)

on:
  workflow_dispatch:
    inputs:
      purge_test_leads:
        description: 'Also delete the fake test rows a form probe leaves in leads (name "Test lead (delete me)", phone 9999999999)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - run: npm run growth:datacheck -- ${{ inputs.purge_test_leads && '--purge-test-leads' || '' }}
